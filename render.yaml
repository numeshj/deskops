# Render blueprint — free tier.
#
# NOT the current deploy target. As of 20 September 2026, deploying this
# Blueprint (and even a plain free Web Service) demanded a card despite
# Render's own docs saying otherwise. The app is deployed on Netlify instead
# — see netlify.toml and DEPLOYING.md. This file is kept in case Render's
# policy reverses; if you try it again, check the card prompt is actually
# gone before relying on it.
#
# The database is NOT defined here: Render's free Postgres expires after 30
# days, and there is no free MySQL. Point DB_* at an external free MySQL
# (see DEPLOYING.md) and this service stays free indefinitely.

services:
  - type: web
    name: deskops
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "1"
      - key: MIGRATE_ON_BOOT
        value: "1"
      - key: JWT_SECRET
        generateValue: true      # Render generates and stores it
      - key: DB_HOST
        sync: false              # set these in the dashboard
      - key: DB_PORT
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false               # "defaultdb" on Aiven — it names the database, not the service
      - key: DB_SSL
        value: "1"               # every hosted free MySQL requires TLS
        # Aiven signs with its own per-project CA. pool.js picks up the
        # pinned copy at server/certs/aiven-ca.pem automatically — no
        # extra env var needed unless that CA is ever rotated.

      # The two sign-in passwords. sync:false means Render asks for them when
      # the blueprint is created rather than storing them in this file, which
      # is in the repository. seedUsers.js refuses to run in production without
      # them, so a deploy cannot quietly fall back to desk1234.
      - key: SEED_USER_PASSWORD
        sync: false
      - key: SEED_ADMIN_PASSWORD
        sync: false
